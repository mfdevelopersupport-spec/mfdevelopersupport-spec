    <text x="0" y="68" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#B91C1C" filter="url(#shadow)" style="letter-spacing: -1px;">Genes</text>
    <text x="2" y="87" font-family="'Montserrat', sans-serif" font-weight="700" font-size="12.5" fill="#DC2626" letter-spacing="0.5">Exigencia y alto desempeño</text>

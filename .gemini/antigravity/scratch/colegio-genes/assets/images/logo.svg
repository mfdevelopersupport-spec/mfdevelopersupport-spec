    <rect x="43" y="32" width="4" height="42" rx="2" fill="url(#goldGrad)"/>
    <path d="M 45 27 C 49 32 47 37 45 40 C 43 37 41 32 45 27 Z" fill="#EF4444"/>
    <path d="M 45 29 C 47 33 46 36 45 38 C 44 36 43 33 45 29 Z" fill="#FBBF24"/>
    <path d="M 26 38 C 36 34 54 50 64 46 C 54 58 36 50 26 62 C 36 68 54 58 64 64" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 64 38 C 54 34 36 50 26 46 C 36 58 54 50 64 62 C 54 68 36 58 26 64" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="45" cy="80" r="4" fill="url(#goldGrad)"/>
    <text x="45" y="87" font-family="'Montserrat', sans-serif" font-weight="900" font-size="6" fill="#FFFFFF" text-anchor="middle">GENES</text>
